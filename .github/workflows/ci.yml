name: GauMon tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Verify executable fixtures in Git checkout
        run: |
          test -x examples/mock_g16 || { echo 'Commit executable mode 100755 for examples/mock_g16'; exit 1; }
          test -f run.sh || { echo 'run.sh is required for CLI regression tests'; exit 1; }
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Compile Python files
        run: python -m compileall -q gaumon gaumon_ext run.py install.py patch_source.py
      - name: Environment check
        run: python run.py --env-check
      - name: Unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python run.py --test
      - name: Installer tests
        run: python -m unittest discover -s tests -p 'test_install_wizard.py' -v
      - name: Source patcher unit tests
        run: python -m unittest discover -s tests -p 'test_source_patcher.py' -v
      - name: Installer dry-run (Conda-free)
        run: python install.py --mode venv --yes --dry-run --no-desktop
